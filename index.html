<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Préstamo de computadoras · Esc. 4-257</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#d0d5dd;--ac:#c2570a;--ok:#e8f3e1;--okb:#3f8f2a;--no:#fde6df;--nob:#d8431f;--sel:#2f7fc1}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2127;--tx:#eceff3;--mu:#9aa4b2;--bd:#363c46;--ok:#1b2e14;--no:#3a1e16}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:900px;margin-inline:auto}
header{background:#111;color:#fff;border-radius:10px 10px 0 0;padding:10px 12px;display:flex;align-items:center;gap:12px}
header img{width:56px;height:56px;border-radius:50%;background:#fff}
header h1{font-size:1.15rem;margin:0}header small{color:#fcc419;font-size:.8rem;display:block}
.franja{height:6px;border-radius:0 0 10px 10px;margin-bottom:12px;background:linear-gradient(90deg,#fcc419 0 25%,#f28c1c 25% 50%,#d8431f 50% 65%,#2f7fc1 65% 85%,#3f8f2a 85%)}
h1{font-size:1.2rem;margin:0 0 4px}h2{font-size:1rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
label{font-size:.8rem;color:var(--mu);display:block;margin-bottom:2px}
input,select,button{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:1rem}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);padding:5px 10px;width:auto;font-size:.85rem}
button:disabled{opacity:.5}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.pc{padding:10px 0;text-align:center;border-radius:8px;border:2px solid var(--okb);background:var(--ok);font-weight:700;cursor:pointer}
.pc.rec{grid-column:span 2}
.pc.busy{border-color:var(--nob);background:var(--no);cursor:not-allowed;opacity:.8}
.pc.sel{background:var(--sel);border-color:var(--sel);color:#fff}
.leg{font-size:.8rem;color:var(--mu);margin-top:6px}
.loan{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:.9rem}
.loan small{color:var(--mu);display:block}
#msg{padding:8px;border-radius:8px;margin-bottom:12px;display:none;font-size:.9rem}
#msg.ok{display:block;background:var(--ok)}#msg.err{display:block;background:var(--no)}
.tag{font-size:.75rem;color:var(--mu)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.bar button{width:auto;padding:7px 12px;font-size:.9rem}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tab{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tab.on{background:#111;color:#fff;border-color:#111}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cal-head h2{margin:0;text-transform:capitalize}
#cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dh{font-size:.75rem;color:var(--mu)}
.day{padding:9px 0;border-radius:8px;border:1px solid var(--bd);cursor:pointer;position:relative;font-size:.95rem}
.day.vacio{border:0;cursor:default}.day.hoy{border-color:var(--ac);font-weight:700}
.day.sel{background:var(--sel);border-color:var(--sel);color:#fff}
.day.tiene::after{content:"";position:absolute;bottom:3px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:#f28c1c}
.cont{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;color:var(--okb);margin-left:auto;text-align:right;white-space:nowrap}
.cont.warn{color:#d97706}.cont.late{color:var(--nob)}
@media print{.bar,.tabs{display:none}}
@media print{button,#form{display:none}header{background:#fff;color:#000;border:1px solid #000}header small{color:#000}}
</style>
</head>

<script>
// ===== CONFIGURACIÓN =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBkzaIIpPXBXi0PJdhMbjfNTZuSryDInMqaTp5KoD2sugShkmoS8rkDP-6Yr_Py4zh8Q/exec";   // Pegar acá la URL de la aplicación web de Apps Script (termina en /exec)
const TOTAL_PC = 30;
const EXTRAS = ["TV","Proyector"];   // recursos que se prestan además de las computadoras
const RECURSOS_RES = ["Carrito de computadoras","TV","Proyector"];   // opciones de reserva
// Cursos de 1ro 1ra a 5to 2da (dos divisiones por año)
const CURSOS = ["1ro","2do","3ro","4to","5to"].flatMap(a=>["1ra","2da"].map(d=>a+" "+d));
const claveCurso = c => String(c).replace(/\D/g,"");   // "1ro 1ra", "1° 1ª" y "1 1" se leen igual: 11
const PASO_MIN = 5;          // los horarios de inicio de las reservas van de a 5 minutos
const HORA_CATEDRA = 35;     // minutos de una hora cátedra en esta escuela
const MAX_HORAS = 7;         // el tiempo de uso se elige hasta 7 horas cátedra (2 horas cátedra = 1 módulo)
const HORA_INI = "08:30", HORA_FIN = "18:00";   // rango horario de las reservas (de a 5 minutos)
// =========================

const $ = id => document.getElementById(id);
let alumnos = [], prestamos = [], reservas = [], pcSel = null;
const DEMO = !SCRIPT_URL;

function msg(t, tipo){ const m=$("msg"); m.textContent=t; m.className=tipo; if(tipo==="ok") setTimeout(()=>m.className="",4000); }

async function api(action, data){
  if(DEMO) return demo(action, data);
  if(data){
    const r = await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...data})});
    return r.json();
  }
  const r = await fetch(SCRIPT_URL+"?action="+action);
  return r.json();
}

// Modo demostración (sin Google Sheet): datos de ejemplo y guardado local
function demo(action, d){
  const P = JSON.parse(localStorage.getItem("prestamosDemo")||"[]");
  if(action==="alumnos") return [{curso:"1ro 1ra",nombre:"Alumno Ejemplo, Juan"},{curso:"3ro 1ra",nombre:"Pérez, Ana"},{curso:"3ro 1ra",nombre:"Gómez, Luis"},{curso:"4to 2da",nombre:"Díaz, Marta"}];
  if(action==="profesores") return ["Profesor Ejemplo 1","Profesora Ejemplo 2"];
  if(action==="materias") return ["Producción Multimedial","Funcionamiento de Sistemas Digitales"];
  const R = JSON.parse(localStorage.getItem("reservasDemo")||"[]");
  if(action==="reservas") return R;
  if(action==="reservar"){ R.push({id:Date.now().toString(),...d}); localStorage.setItem("reservasDemo",JSON.stringify(R)); return {ok:true}; }
  if(action==="cancelar_reserva"){ localStorage.setItem("reservasDemo",JSON.stringify(R.filter(r=>r.id!==d.id))); return {ok:true}; }
  if(action==="prestamos") return P;
  if(action==="registrar"){ if(P.some(p=>String(p.pc)===String(d.pc))) return {ok:false,error:"El recurso "+d.pc+" ya está en uso"};
    P.push({id:Date.now().toString(),fecha:new Date().toISOString(),...d}); localStorage.setItem("prestamosDemo",JSON.stringify(P)); return {ok:true}; }
  if(action==="devolver"){ localStorage.setItem("prestamosDemo",JSON.stringify(P.filter(p=>p.id!==d.id))); return {ok:true}; }
}

function cargarCursos(){
  const prev=$("curso").value, prevR=$("rcurso").value;
  const cursos=CURSOS;
  const h=cursos.map(c=>`<option>${c}</option>`).join("");
  $("curso").innerHTML=h; $("rcurso").innerHTML=h;
  if(cursos.includes(prev)) $("curso").value=prev;
  if(cursos.includes(prevR)) $("rcurso").value=prevR;
  cargarAlumnos();
}
function cargarAlumnos(){
  const prev=$("alumno").value, c=$("curso").value;
  const noms=alumnos.filter(a=>claveCurso(a.curso)===claveCurso(c)).map(a=>a.nombre).sort((x,y)=>x.localeCompare(y,"es"));
  $("alumno").innerHTML=noms.map(n=>`<option>${n}</option>`).join("");
  if(noms.includes(prev)) $("alumno").value=prev;
}
const recTxt=r=>isNaN(r)?r:"PC "+r;
const ordRec=r=>isNaN(r)?1000+EXTRAS.indexOf(r):+r;
function dibujarGrid(){
  const ocupadas=new Set(prestamos.map(p=>String(p.pc)));
  if(pcSel!==null && ocupadas.has(String(pcSel))) pcSel=null;
  let h="";
  for(let i=1;i<=TOTAL_PC;i++){
    const b=ocupadas.has(String(i));
    h+=`<div class="pc ${b?"busy":""} ${pcSel===i?"sel":""}" data-n="${i}">${i}</div>`;
  }
  h+=EXTRAS.map(x=>`<div class="pc rec ${ocupadas.has(x)?"busy":""} ${pcSel===x?"sel":""}" data-n="${x}">${x}</div>`).join("");
  $("grid").innerHTML=h;
  $("selTxt").textContent=pcSel!==null?`— ${recTxt(pcSel)}`:"";
  const extra=pcSel!==null&&isNaN(pcSel);   // TV o proyector: lo pide el docente, sin alumno
  $("boxAlumno").hidden=extra;
  $("h2Alumno").textContent=extra?"2. Curso (lo retira el docente)":"2. Alumno";
}
function finDe(p){ const t=new Date(p.fecha).getTime()+(+p.minutos)*60000; return isNaN(t)?null:new Date(t); }
function etqMin(m){
  const h=Math.round(m/HORA_CATEDRA); if(h*HORA_CATEDRA!==+m) return m+" min";
  const mod=h%2===0?` · ${h/2} ${h/2===1?"módulo":"módulos"}`:"";
  return `${h} ${h===1?"hora cátedra":"horas cátedra"}${mod} (${m} min)`;
}
function finTxt(p){ const f=finDe(p); return f?`${etqMin(p.minutos)} · hasta ${f.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}`:"sin tiempo"; }
function vencido(p){ const f=finDe(p); return f&&f<new Date(); }
function llenar(id,arr,guardado){ const act=$(id).value; $(id).innerHTML=arr.map(x=>`<option>${x}</option>`).join(""); const g=localStorage.getItem(guardado); if(arr.includes(act)) $(id).value=act; else if(g&&arr.includes(g)) $(id).value=g; }
function dibujarLista(){
  $("cnt").textContent=prestamos.length;
  $("lista").innerHTML=prestamos.length?prestamos.slice().sort((a,b)=>ordRec(a.pc)-ordRec(b.pc)).map(p=>
    `<div class="loan"><div><b>${recTxt(p.pc)}</b>${p.alumno&&p.alumno!=="—"?" · "+p.alumno+" ("+p.curso+")":" · "+p.curso}<small>${p.docente} · ${p.materia} · <span style="${vencido(p)?'color:var(--nob);font-weight:700':''}">${finTxt(p)}</span></small></div>
     <div class="cont" data-fin="${finDe(p)?finDe(p).getTime():""}"></div><button class="sec" data-id="${p.id}">Devolver</button></div>`).join("")
    :`<div class="tag">No hay computadoras prestadas.</div>`;
}
async function refrescar(){
  try{ const p=await api("prestamos"), r=await api("reservas"); prestamos=Array.isArray(p)?p:[]; reservas=Array.isArray(r)?r:[]; }
  catch(e){ msg("No se pudo actualizar desde el Sheet.","err"); }
  dibujarGrid(); dibujarLista(); dibujarCal(); dibujarReservas(); tick();
}

$("grid").addEventListener("click",e=>{
  const v=e.target.dataset.n; if(!v||e.target.classList.contains("busy")) return;
  pcSel=isNaN(v)?v:+v; dibujarGrid();
});
$("curso").addEventListener("change",cargarAlumnos);
$("lista").addEventListener("click",async e=>{
  const id=e.target.dataset.id; if(!id) return;
  e.target.disabled=true;
  try{ const r=await api("devolver",{id}); r.ok?msg("Computadora devuelta.","ok"):msg(r.error,"err"); }
  catch(err){ msg("Error de conexión.","err"); }
  refrescar();
});
$("btn").addEventListener("click",async()=>{
  const d={docente:$("docente").value,materia:$("materia").value,minutos:+$("minutos").value,curso:$("curso").value,alumno:$("alumno").value,pc:pcSel};
  if(!d.docente||!d.materia) return msg("Seleccioná docente y materia.","err");
  const esPC=!isNaN(d.pc);
  if(esPC&&!d.alumno) return msg("Seleccioná un alumno.","err");
  if(d.pc===null) return msg("Seleccioná una computadora, TV o proyector.","err");
  if(!esPC) d.alumno="—";
  if(d.alumno!=="—"&&prestamos.some(p=>p.alumno===d.alumno&&p.curso===d.curso)) return msg(d.alumno+" ya tiene una computadora en uso.","err");
  $("btn").disabled=true;
  try{
    const r=await api("registrar",d);
    if(r.ok){ msg(`Préstamo registrado: ${recTxt(d.pc)}${d.alumno==="—"?"":" → "+d.alumno}.`,"ok"); localStorage.setItem("docente",d.docente); localStorage.setItem("materia",d.materia); pcSel=null; }
    else msg(r.error||"No se pudo registrar.","err");
  }catch(e){ msg("Error de conexión. Reintentá.","err"); }
  $("btn").disabled=false; refrescar();
});

// Contador de tiempo de cada préstamo (se actualiza cada segundo, sin volver a dibujar la lista)
function tick(){
  const ahora=Date.now();
  document.querySelectorAll(".cont").forEach(el=>{
    const f=+el.dataset.fin; if(!f){ el.textContent=""; return; }
    const seg=Math.round((f-ahora)/1000), tarde=seg<0, d=Math.abs(seg);
    const t=String(Math.floor(d/60)).padStart(2,"0")+":"+String(d%60).padStart(2,"0");
    el.textContent=tarde?"+"+t+" excedido":t;
    el.className="cont "+(tarde?"late":d<=300?"warn":"");
    el.title=tarde?"Tiempo excedido":"Tiempo restante";
  });
}
// ===== Reservas =====
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let diaSel=iso(new Date()), mesVer=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function fechaLarga(f){ const [y,m,d]=f.split("-"); return new Date(y,m-1,d).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"}); }
function dibujarCal(){
  $("mesTit").textContent=mesVer.toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  const y=mesVer.getFullYear(), m=mesVer.getMonth(), off=(mesVer.getDay()+6)%7, n=new Date(y,m+1,0).getDate(), hoy=iso(new Date());
  const con=new Set(reservas.map(r=>r.fecha));
  let h=["L","M","X","J","V","S","D"].map(x=>`<div class="dh">${x}</div>`).join("")+`<div class="day vacio"></div>`.repeat(off);
  for(let d=1;d<=n;d++){ const f=iso(new Date(y,m,d));
    h+=`<div class="day ${f===hoy?"hoy":""} ${f===diaSel?"sel":""} ${con.has(f)?"tiene":""}" data-f="${f}">${d}</div>`; }
  $("cal").innerHTML=h;
}
const aMin=h=>{const [x,y]=h.split(":");return +x*60+ +y;};
const aHora=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function dibujarReservas(){
  $("diaTxt").textContent=fechaLarga(diaSel);
  const L=reservas.filter(r=>r.fecha===diaSel).sort((x,y)=>(x.hora||"99").localeCompare(y.hora||"99"));
  $("listaRes").innerHTML=L.length?L.map(r=>{
    const hr=r.hora?`${r.hora}–${aHora(aMin(r.hora)+(+r.minutos||0))} (${etqMin(r.minutos)})`:"sin horario";
    return `<div class="loan"><div><b>${hr}</b> · ${r.recurso||RECURSOS_RES[0]}<small>${r.docente} · ${r.curso} · ${r.materia}</small></div><button class="sec" data-rid="${r.id}">Cancelar</button></div>`;
  }).join(""):`<div class="tag">Sin reservas para este día.</div>`;
}
$("cal").addEventListener("click",e=>{ const f=e.target.dataset.f; if(!f) return; diaSel=f; dibujarCal(); dibujarReservas(); });
$("mesAnt").addEventListener("click",()=>{ mesVer=new Date(mesVer.getFullYear(),mesVer.getMonth()-1,1); dibujarCal(); });
$("mesSig").addEventListener("click",()=>{ mesVer=new Date(mesVer.getFullYear(),mesVer.getMonth()+1,1); dibujarCal(); });
$("btnRes").addEventListener("click",async()=>{
  const d={fecha:diaSel,docente:$("rdocente").value,materia:$("rmateria").value,curso:$("rcurso").value,recurso:$("rrecurso").value,hora:$("rhora").value,minutos:+$("rminutos").value};
  if(!d.docente||!d.materia||!d.curso) return msg("Seleccioná docente, materia y curso.","err");
  if(d.fecha<iso(new Date())) return msg("No se puede reservar en una fecha pasada.","err");
  if(aMin(d.hora)+d.minutos>aMin(HORA_FIN)) return msg(`La reserva termina después de las ${HORA_FIN}. Reducí el tiempo o adelantá el inicio.`,"err");
  if(reservas.some(r=>r.fecha===d.fecha&&r.hora===d.hora&&(r.recurso||RECURSOS_RES[0])===d.recurso&&r.docente===d.docente&&r.curso===d.curso)) return msg("Esa reserva ya existe.","err");
  $("btnRes").disabled=true;
  try{ const r=await api("reservar",d); if(r.ok){ msg("Reserva registrada.","ok"); localStorage.setItem("docente",d.docente); localStorage.setItem("materia",d.materia); } else msg(r.error||"No se pudo reservar.","err"); }
  catch(e){ msg("Error de conexión. Reintentá.","err"); }
  $("btnRes").disabled=false; refrescar();
});
$("listaRes").addEventListener("click",async e=>{
  const id=e.target.dataset.rid; if(!id) return; e.target.disabled=true;
  try{ const r=await api("cancelar_reserva",{id}); r.ok?msg("Reserva cancelada.","ok"):msg(r.error,"err"); }catch(err){ msg("Error de conexión.","err"); }
  refrescar();
});
document.querySelector(".tabs").addEventListener("click",e=>{
  const t=e.target.dataset.t; if(!t) return;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  $("tab-prestamos").hidden=t!=="prestamos"; $("tab-reservas").hidden=t!=="reservas";
});

// Actualiza la conexión con el Sheet sin recargar la página (conserva lo que está elegido)
async function actualizarTodo(manual){
  const b=$("btnAct"); b.disabled=true; b.textContent="Actualizando…";
  try{
    alumnos=await api("alumnos");
    const prof=await api("profesores"), mat=await api("materias");
    ["docente","rdocente"].forEach(i=>llenar(i,prof,"docente"));
    ["materia","rmateria"].forEach(i=>llenar(i,mat,"materia"));
    cargarCursos(); await refrescar();
    $("actTxt").textContent="Actualizado "+new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
    if(manual) msg("Datos actualizados desde el Sheet.","ok");
  }catch(e){ msg("No se pudo conectar con el Sheet.","err"); }
  b.disabled=false; b.textContent="↻ Actualizar datos";
}

(async function init(){
  $("modo").textContent=DEMO?"Modo demostración: configurá SCRIPT_URL para conectar con Google Sheets.":"Conectado a Google Sheets";
  let mins=[]; for(let h=1;h<=MAX_HORAS;h++) mins.push(h*HORA_CATEDRA);
  $("minutos").innerHTML=mins.map(m=>`<option value="${m}">${etqMin(m)}</option>`).join("");
  $("minutos").value=2*HORA_CATEDRA;
  let hs=[]; for(let m=aMin(HORA_INI);m<=aMin(HORA_FIN)-PASO_MIN;m+=PASO_MIN) hs.push(aHora(m));
  $("rrecurso").innerHTML=RECURSOS_RES.map(x=>`<option>${x}</option>`).join("");
  $("rhora").innerHTML=hs.map(h=>`<option>${h}</option>`).join("");
  $("rminutos").innerHTML=mins.map(m=>`<option value="${m}">${etqMin(m)}</option>`).join("");
  $("rminutos").value=2*HORA_CATEDRA;
  $("btnAct").addEventListener("click",()=>actualizarTodo(true));
  await actualizarTodo(false);
  setInterval(refrescar,30000);
  setInterval(tick,1000);
})();
</script>
</body>
</html>
